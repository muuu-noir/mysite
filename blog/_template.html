<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self' https://www.googletagmanager.com;
        script-src-attr 'none';
        style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        style-src-attr 'none';
        img-src 'self' https://imgx.foriio.com https://foriio.imgix.net https://img.foriio.com https://www.google-analytics.com https://www.googletagmanager.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        connect-src 'self' https://api.foriio.com https://docs.google.com https://doc-0c-4o-sheets.googleusercontent.com https://www.google-analytics.com https://www.googletagmanager.com;
        object-src 'none';
        base-uri 'none';
        form-action https://docs.google.com;
        frame-src 'none';
        worker-src 'none';
        media-src 'none';
    ">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLHXZS4T3C"></script>
    <script src="../js/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | 396 FOLIO</title>
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{title}} | 396 FOLIO">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="{{url}}">
    <link rel="icon" href="../img/profile/profile_avatar.png">
    <link rel="apple-touch-icon" href="../img/profile/profile_avatar.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/config_v2.js"></script>
    <script src="../js/components.js" defer></script>
    <script src="../js/main.js" defer></script>

    <script type="application/ld+json">
    {{jsonld}}
    </script>
</head>

<body>
    <site-header data-base="../"></site-header>
    <main id="main-content">
        <section class="container">
        <article class="blog-article">
            <div class="article-header">
                <div class="article-meta">
                    <time datetime="{{dateISO}}">{{dateFormatted}}</time>
                    <span class="article-category">{{category}}</span>
                    <span class="article-reading-time"><i class="fa-regular fa-clock"></i> {{readingTime}}</span>
                </div>
                <h1 class="article-title">{{title}}</h1>
            </div>
            <div class="article-body">
                {{content}}
            </div>
            <div class="article-footer">
                <a href="../news.html" class="btn-more"><i class="fas fa-chevron-left"></i> NEWS に戻る</a>
            </div>
        </article>
        </section>
    </main>
    <site-footer></site-footer>
    <floating-cta href="../contact.html">お問い合わせ</floating-cta>
</body>

</html>
